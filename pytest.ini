[pytest]
testpaths = backend/tests tests
filterwarnings =
    ignore:.*Using `httpx` with `starlette\.testclient`.*:Warning
    ignore:.*The anyio\.abc\.BlockingPortal alias is deprecated.*:Warning
    ignore::DeprecationWarning:anyio.*
    ignore::DeprecationWarning:starlette.*
    ignore:.*StarletteDeprecationWarning.*
